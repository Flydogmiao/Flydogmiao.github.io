<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抽签系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 25px;
        }
        .input-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            background: #f9f9f9;
            transition: border 0.3s, box-shadow 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(102,126,234,0.3);
        }
        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(102,126,234,0.2);
        }
        .btn:disabled {
            background: #ccc;
            box-shadow: none;
            pointer-events: none;
        }
        .result-card {
            margin-top: 25px;
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #f0f0f0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s;
        }
        .result-card .name {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 6px;
        }
        .result-card .gender {
            font-size: 16px;
            color: #888;
            margin-bottom: 12px;
        }
        .result-card .hospital {
            font-size: 18px;
            font-weight: 600;
            color: #764ba2;
            margin-bottom: 4px;
        }
        .result-card .region {
            font-size: 15px;
            color: #999;
        }
        .result-card .placeholder {
            font-size: 16px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 抽签系统</h1>
        <p class="subtitle">输入学号，点击抽签查看结果</p>

        <div class="input-group">
            <label>学号</label>
            <input type="text" id="studentIdInput" placeholder="例如 2023110107" inputmode="numeric">

        <div class="result-card" id="resultCard">
            <span class="placeholder">等待抽签…</span>
        </div>
    </div>

        const drawnStudents = new Set();

        function startDraw() {
            const id = document.getElementById('studentIdInput').value.trim();
            const resultCard = document.getElementById('resultCard');
            const drawBtn = document.getElementById('drawBtn');

            if (!id) {
                resultCard.innerHTML = '<span class="placeholder">请输入学号</span>';
                return;
            }

            if (drawnStudents.has(id)) {
                const data = studentData[id];
                if (data) showResult(data);
                return;
            }

            if (!studentData[id]) {
                resultCard.innerHTML = '<span class="placeholder">学号不存在</span>';
                return;
            }

            resultCard.innerHTML = '<span class="placeholder">抽签中，请稍候…</span>';
            drawBtn.disabled = true;

            setTimeout(() => {
                const data = studentData[id];
                showResult(data);
                drawnStudents.add(id);
                drawBtn.disabled = false;
            }, 1000);
        }

        function showResult(data) {
            const resultCard = document.getElementById('resultCard');
            resultCard.innerHTML = `
                <div class="name">${data.name}</div>
                <div class="gender">性别：${data.gender}</div>
                <div class="hospital">${data.hospital}</div>
                <div class="region">${data.region}</div>
            `;
        }
    </script>
