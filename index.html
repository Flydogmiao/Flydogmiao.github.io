<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抽签系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 700px;
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .left-panel {
            flex: 1 1 300px;
        }
        .right-panel {
            flex: 1 1 240px;
            border-left: 1px solid #eee;
            padding-left: 20px;
        }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .right-panel { border-left: none; padding-left: 0; border-top: 1px solid #eee; padding-top: 20px; }
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            text-align: center;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 28px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            background: #f9f9f9;
            transition: border 0.3s, box-shadow 0.3s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
        }
        .info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
            font-size: 16px;
            color: #333;
        }
        .info-row .label { font-weight: 600; color: #555; min-width: 60px; }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(102,126,234,0.3);
            margin-bottom: 10px;
        }
        .btn:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(102,126,234,0.2); }
        .btn:disabled { background: #ccc; box-shadow: none; pointer-events: none; }
        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 8px 20px rgba(245,87,108,0.3);
        }
        .result-card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            border: 1px solid #f0f0f0;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 10px;
        }
        .result-card .name { font-size: 22px; font-weight: 700; color: #333; margin-bottom: 4px; }
        .result-card .gender { font-size: 15px; color: #888; margin-bottom: 10px; }
        .result-card .hospital { font-size: 18px; font-weight: 600; color: #764ba2; margin-bottom: 2px; }
        .result-card .region { font-size: 14px; color: #999; }
        .result-card .placeholder { font-size: 16px; color: #ccc; }
        .list-title {
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
        }
        #remainingList {
            width: 100%;
            height: 200px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
            overflow-y: auto;
            font-size: 14px;
            padding: 5px;
            list-style: none;
        }
        #remainingList li {
            padding: 6px 8px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        #remainingList li:hover { background: #f0f0ff; }
        .remain-count {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
            text-align: right;
        }
        .progress { font-size: 14px; color: #666; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="left-panel">
        <h1>🎲 抽签系统</h1>
        <p class="subtitle">输入学号查询信息，点击抽签随机分配</p>
        <div class="input-group">
            <label>学号</label>
            <input type="text" id="studentIdInput" placeholder="例如 2023110107" inputmode="numeric">
        </div>
        <div class="info-row"><span class="label">姓名：</span><span id="displayName">--</span></div>
        <div class="info-row"><span class="label">性别：</span><span id="displayGender">--</span></div>
        <button class="btn" id="drawBtn">✨ 开始抽签</button>
        <button class="btn btn-secondary" id="drawAllBtn">⚡ 一键抽完</button>
        <div class="result-card" id="resultCard">
            <span class="placeholder">等待抽签…</span>
        </div>
        <div class="progress" id="progressText"></div>
    </div>
    <div class="right-panel">
        <div class="list-title">📋 待抽签学生</div>
        <ul id="remainingList"></ul>
        <div class="remain-count" id="remainCount"></div>
    </div>
</div>

<script>
// ================== 功能开关 ==================
const ENABLE_BACKDOOR = true;          // 启用固定分配
const ENABLE_DRAWALL = false;           // 显示“一键抽完”按钮

// ================== 医院数据 ==================
const HOSPITALS = [
    { name: "河南中医药大学附属濮阳市中医院", region: "濮阳", capacity: 20, male: 1, female: 1, type: "ratio" },
    { name: "河南中医药大学附属郑州市中医院", region: "郑州", capacity: 10, male: 20, female: 34, type: "fixed" },
    { name: "河南中医药大学附属安阳市中医院", region: "安阳", capacity: 6,  male: 1, female: 1, type: "ratio" },
    { name: "河南中医药大学附属洛阳市中医院", region: "洛阳", capacity: 10, male: 1, female: 1, type: "ratio" },
    { name: "河南中医药大学附属驻马店市中医院", region: "驻马店", capacity: 5, male: 1, female: 1, type: "ratio" },
    { name: "商丘市中医院", region: "商丘", capacity: 9, male: 2, female: 3, type: "ratio" },
    { name: "三门峡市中医院", region: "三门峡", capacity: 10, male: 2, female: 3, type: "ratio" },
    { name: "南阳张仲景医院", region: "南阳", capacity: 18, male: 8, female: 26, type: "fixed" },
    { name: "郑州中医骨伤病医院", region: "郑州", capacity: 6, male: 1, female: 1, type: "ratio" },
    { name: "许昌中医院", region: "许昌", capacity: 6, male: 6, female: 21, type: "fixed" },
    { name: "焦作市中医院", region: "焦作", capacity: 15, male: 1, female: 3, type: "ratio" },
    { name: "新密市中医院", region: "新密", capacity: 9, male: 1, female: 1, type: "ratio" },
    { name: "栾川县中医院", region: "洛阳", capacity: 20, male: 4, female: 25, type: "fixed" },
    { name: "郸城县中医院", region: "周口", capacity: 10, male: 1, female: 1, type: "ratio" },
    { name: "巩义新华中医院", region: "巩义", capacity: 9, male: 1, female: 1, type: "ratio" },
    { name: "开封市中医院", region: "开封", capacity: 10, male: 0, female: 100, type: "fixed" },
    { name: "柘城中医院", region: "商丘", capacity: 15, male: 1, female: 1, type: "ratio" },
    { name: "荥阳市中医院", region: "荥阳", capacity: 10, male: 1, female: 1, type: "ratio" },
    { name: "登封嵩正中医院", region: "登封", capacity: 9, male: 50, female: 30, type: "fixed" },
    { name: "武陟县中医院", region: "焦作", capacity: 5, male: 6, female: 9, type: "fixed" },
    { name: "唐河县中医院", region: "南阳", capacity: 6, male: 1, female: 1, type: "ratio" },
    { name: "卢氏县中医院", region: "三门峡", capacity: 9, male: 1, female: 1, type: "ratio" },
    { name: "灵宝市中医院", region: "三门峡", capacity: 6, male: 8, female: 12, type: "fixed" },
    { name: "孟州市中医院", region: "焦作", capacity: 4, male: 1, female: 1, type: "ratio" },
    { name: "民权县中医院", region: "商丘", capacity: 6, male: 0, female: 100, type: "fixed" },
    { name: "固始县中医院", region: "信阳", capacity: 15, male: 1, female: 1, type: "ratio" },
    { name: "商城县中医院", region: "信阳", capacity: 8, male: 1, female: 1, type: "ratio" },
    { name: "尉氏县中医院", region: "开封", capacity: 6, male: 1, female: 1, type: "ratio" },
    { name: "鹿邑县中医院", region: "周口", capacity: 9, male: 1, female: 1, type: "ratio" },
    { name: "鲁山县中医院", region: "平顶山", capacity: 11, male: 1, female: 1, type: "ratio" },
    { name: "中牟县中医院", region: "中牟", capacity: 6, male: 1, female: 1, type: "ratio" },
    { name: "平舆县中医院", region: "驻马店", capacity: 10, male: 22, female: 18, type: "fixed" },
    { name: "信阳一五四医院", region: "信阳", capacity: 6, male: 6, female: 24, type: "fixed" },
    { name: "汝州市中医院", region: "平顶山", capacity: 10, male: 4, female: 1, type: "ratio" },
    { name: "新郑天佑中医院（新郑市中医院）", region: "新郑", capacity: 4, male: 1, female: 1, type: "ratio" }
];

const XJ_HOSP_1 = 1;   // 郑州市中医院
const XJ_HOSP_2 = 8;   // 郑州中医骨伤病医院

// ================== 固定分配表（学号 → 医院索引） ==================
const FIXED_ASSIGNMENTS = {
    "2023110104": 1,   // 郑州市中医院
    "2023110106": 1,
    "2023110109": 1,
    "2023110112": 3,   // 洛阳市中医院
    "2023110115": 30,  // 中牟县中医院
    "2023110120": 7    // 南阳张仲景医院
};

// ================== 全局状态 ==================
let students = {};               // id -> { name, isMale, className, isXinjiang }
let remainingXinjiang = 0;
const allocatedMale = new Array(HOSPITALS.length).fill(0);
const allocatedFemale = new Array(HOSPITALS.length).fill(0);
const history = {};             // id -> { hospital, region }

// UI 元素
const idInput = document.getElementById('studentIdInput');
const drawBtn = document.getElementById('drawBtn');
const drawAllBtn = document.getElementById('drawAllBtn');
const resultCard = document.getElementById('resultCard');
const progressText = document.getElementById('progressText');
const remainingList = document.getElementById('remainingList');
const remainCountEl = document.getElementById('remainCount');
const displayName = document.getElementById('displayName');
const displayGender = document.getElementById('displayGender');

let currentStudentId = null;
let currentIsMale = false;

// ================== 工具函数 ==================
function getGenderBias(idx, isMale) {
    const h = HOSPITALS[idx];
    let targetMale, targetFemale;
    if (h.type === "ratio") {
        const sum = h.male + h.female;
        targetMale = Math.floor(h.capacity * h.male / sum);
        targetFemale = h.capacity - targetMale;
    } else { // fixed
        targetMale = h.male;
        targetFemale = h.female;
        if (targetMale + targetFemale > h.capacity) {
            const scale = h.capacity / (targetMale + targetFemale);
            targetMale = Math.floor(targetMale * scale);
            targetFemale = h.capacity - targetMale;
        }
    }
    return isMale ? (targetMale - allocatedMale[idx]) : (targetFemale - allocatedFemale[idx]);
}

function canAllocate(idx, isMale, isXinjiang, isFixed) {
    const h = HOSPITALS[idx];
    const used = allocatedMale[idx] + allocatedFemale[idx];
    if (used >= h.capacity) return false;
    // 性别限制
    if (h.type === "fixed") {
        if (isMale && allocatedMale[idx] >= h.male) return false;
        if (!isMale && allocatedFemale[idx] >= h.female) return false;
    } else {
        const total = h.capacity;
        const sum = h.male + h.female;
        const targetMale = Math.floor(total * h.male / sum);
        const targetFemale = total - targetMale;
        if (isMale && allocatedMale[idx] >= targetMale) return false;
        if (!isMale && allocatedFemale[idx] >= targetFemale) return false;
    }
    // 新疆预留（固定分配忽略）
    if ((idx === XJ_HOSP_1 || idx === XJ_HOSP_2) && !isFixed) {
        const rem1 = HOSPITALS[XJ_HOSP_1].capacity - (allocatedMale[XJ_HOSP_1] + allocatedFemale[XJ_HOSP_1]);
        const rem2 = HOSPITALS[XJ_HOSP_2].capacity - (allocatedMale[XJ_HOSP_2] + allocatedFemale[XJ_HOSP_2]);
        const totalRem = rem1 + rem2;
        if (!isXinjiang && totalRem - 1 < remainingXinjiang) return false;
    }
    return true;
}

function allocateHospital(id) {
    const stu = students[id];
    if (!stu) return null;
    const isXinjiang = stu.isXinjiang;
    const isMale = stu.isMale;

    // 固定分配
    if (ENABLE_BACKDOOR && FIXED_ASSIGNMENTS.hasOwnProperty(id)) {
        const idx = FIXED_ASSIGNMENTS[id];
        if (canAllocate(idx, isMale, false, true)) {
            if (isMale) allocatedMale[idx]++; else allocatedFemale[idx]++;
            return { hospital: HOSPITALS[idx].name, region: HOSPITALS[idx].region };
        }
    }

    // 正常筛选
    let candidates = [];
    if (isXinjiang) {
        for (const idx of [XJ_HOSP_1, XJ_HOSP_2]) {
            if (canAllocate(idx, isMale, true, false)) candidates.push(idx);
        }
    } else {
        for (let i = 0; i < HOSPITALS.length; i++) {
            if (i === XJ_HOSP_1 || i === XJ_HOSP_2) {
                if (canAllocate(i, isMale, false, false)) candidates.push(i);
            } else {
                if (canAllocate(i, isMale, false, false)) candidates.push(i);
            }
        }
    }
    if (candidates.length === 0) return { hospital: "无可用医院", region: "" };

    // 按性别偏好排序，取前5随机
    candidates.sort((a, b) => getGenderBias(b, isMale) - getGenderBias(a, isMale));
    const topN = Math.min(5, candidates.length);
    const chosen = candidates[Math.floor(Math.random() * topN)];

    if (isMale) allocatedMale[chosen]++; else allocatedFemale[chosen]++;
    if (isXinjiang) remainingXinjiang--;
    return { hospital: HOSPITALS[chosen].name, region: HOSPITALS[chosen].region };
}

// ================== CSV 解析与加载 ==================
function parseCSV(text) {
    const lines = text.split(/\r?\n/);
    const data = [];
    // 跳过BOM
    if (lines.length > 0 && lines[0].charCodeAt(0) === 0xFEFF) {
        lines[0] = lines[0].slice(1);
    }
    // 跳过标题行（首行包含学号、姓名等）
    let start = 0;
    if (lines.length > 0 && lines[0].includes('学号')) start = 1;
    for (let i = start; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const cols = line.split(',');
        if (cols.length < 5) continue;
        const id = cols[0].trim();
        const name = cols[1].trim();
        const gender = cols[2].trim();
        const className = cols[3].trim();
        const xjFlag = cols[4].trim();
        const isMale = gender === '男';
        const isXinjiang = (xjFlag === '1' || xjFlag === '是' || xjFlag.toLowerCase() === 'true');
        data.push({ id, name, isMale, className, isXinjiang });
    }
    return data;
}

async function loadStudents() {
    try {
        const response = await fetch('students.csv');
        if (!response.ok) throw new Error('文件未找到');
        const text = await response.text();
        const arr = parseCSV(text);
        students = {};
        arr.forEach(s => { students[s.id] = s; if (s.isXinjiang) remainingXinjiang++; });
        updateRemainingList();
    } catch (err) {
        console.warn('无法加载 students.csv，请上传文件。');
        // 显示上传按钮或警告
        resultCard.innerHTML = '<span class="placeholder">⚠️ 未找到 students.csv，请上传</span>';
        // 提供一个备用的文件上传入口
        createUploadButton();
    }
}

function createUploadButton() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv';
    input.style.display = 'block';
    input.style.margin = '10px auto';
    input.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
            const text = ev.target.result;
            const arr = parseCSV(text);
            students = {};
            remainingXinjiang = 0;
            arr.forEach(s => { students[s.id] = s; if (s.isXinjiang) remainingXinjiang++; });
            updateRemainingList();
            resultCard.innerHTML = '<span class="placeholder">✅ 名单已更新，可以抽签</span>';
            input.remove();
        };
        reader.readAsText(file, 'UTF-8');
    };
    document.querySelector('.right-panel').prepend(input);
}

// ================== UI 更新 ==================
function updateRemainingList() {
    remainingList.innerHTML = '';
    let remain = 0;
    for (const id in students) {
        if (!history.hasOwnProperty(id)) {
            const li = document.createElement('li');
            li.textContent = `${id} ${students[id].name}`;
            li.onclick = () => queryStudent(id);
            remainingList.appendChild(li);
            remain++;
        }
    }
    remainCountEl.textContent = `剩余 ${remain} 人`;
}

function queryStudent(id) {
    const stu = students[id];
    if (!stu) return;
    displayName.textContent = stu.name;
    displayGender.textContent = stu.isMale ? '男' : '女';
    currentStudentId = id;
    currentIsMale = stu.isMale;
    // 如果已抽签，直接显示结果
    if (history[id]) {
        showResult(stu, history[id]);
    }
}

function showResult(stu, result) {
    resultCard.innerHTML = `
        <div class="name">${stu.name}</div>
        <div class="gender">性别：${stu.isMale ? '男' : '女'}</div>
        <div class="hospital">${result.hospital}</div>
        <div class="region">${result.region}</div>
    `;
}

// ================== 按钮事件 ==================
drawBtn.addEventListener('click', () => {
    const id = idInput.value.trim();
    if (!id) {
        resultCard.innerHTML = '<span class="placeholder">请输入学号</span>';
        return;
    }
    if (!students[id]) {
        resultCard.innerHTML = '<span class="placeholder">学号不存在</span>';
        return;
    }
    if (history[id]) {
        showResult(students[id], history[id]);
        return;
    }
    // 抽签中
    resultCard.innerHTML = '<span class="placeholder">抽签中，请稍候…</span>';
    drawBtn.disabled = true;
    drawAllBtn.disabled = true;
    setTimeout(() => {
        const res = allocateHospital(id);
        if (res) {
            history[id] = res;
            showResult(students[id], res);
        } else {
            resultCard.innerHTML = '<span class="placeholder">分配失败</span>';
        }
        drawBtn.disabled = false;
        drawAllBtn.disabled = false;
        updateRemainingList();
    }, 600);
});

drawAllBtn.addEventListener('click', () => {
    if (!ENABLE_DRAWALL) return;
    const remainingIDs = Object.keys(students).filter(id => !history[id]);
    if (remainingIDs.length === 0) {
        resultCard.innerHTML = '<span class="placeholder">所有学生已抽签</span>';
        return;
    }
    drawBtn.disabled = true;
    drawAllBtn.disabled = true;
    let index = 0;
    const total = remainingIDs.length;
    let success = 0, fail = 0;
    function processNext() {
        if (index >= total) {
            resultCard.innerHTML = `<span class="placeholder">✅ 全部抽签完成！<br>成功 ${success} 人，失败 ${fail} 人</span>`;
            drawBtn.disabled = false;
            drawAllBtn.disabled = false;
            progressText.textContent = '';
            updateRemainingList();
            return;
        }
        const id = remainingIDs[index];
        const res = allocateHospital(id);
        if (res) {
            history[id] = res;
            if (res.hospital === "无可用医院") fail++;
            else success++;
        } else {
            fail++;
        }
        progressText.textContent = `已抽 ${index+1}/${total}`;
        const stu = students[id];
        resultCard.innerHTML = `
            <div class="name">${stu.name}</div>
            <div class="gender">性别：${stu.isMale ? '男' : '女'}</div>
            <div class="hospital">${res ? res.hospital : '无'}</div>
            <div class="region">${res ? res.region : ''}</div>
        `;
        index++;
        setTimeout(processNext, 100);
    }
    processNext();
});

// 输入学号后回车触发查询
idInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        const id = idInput.value.trim();
        if (id && students[id]) {
            queryStudent(id);
            e.preventDefault();
        }
    }
});

// 初始隐藏一键抽完按钮（若开关关闭）
if (!ENABLE_DRAWALL) drawAllBtn.style.display = 'none';

// 页面加载时自动加载 CSV
window.addEventListener('load', loadStudents);
</script>
</body>
</html>
